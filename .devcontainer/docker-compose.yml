# Öğrenci ortamı — üretim ortamıyla AYNI sürüm (lab/ortam/docker-compose.yml, n8n 2.40.6)
services:
  calisma:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.6
    restart: unless-stopped
    network_mode: service:calisma
    environment:
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://${CODESPACE_NAME}-5678.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}/
    volumes:
      - n8n_veri:/home/node/.n8n
volumes:
  n8n_veri:
